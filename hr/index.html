<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Account Control Terminal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    background:#000504;
    color:#00ff9d;
    font-family:'Orbitron',sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow-x:hidden;
    padding:20px;
}

#matrixCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    background:#000302;
    opacity:.9;
    pointer-events:none;
}

.background-overlay{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;

    background:
        radial-gradient(circle at center,rgba(0,255,157,.08),rgba(0,0,0,.40) 75%),
        linear-gradient(90deg,rgba(0,255,157,.035) 1px,transparent 1px),
        linear-gradient(rgba(0,255,157,.035) 1px,transparent 1px);

    background-size:auto,45px 45px,45px 45px;
}

.background-glow{
    position:fixed;
    width:500px;
    height:500px;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:#00ff9d;
    opacity:.06;
    filter:blur(130px);
    z-index:1;
    pointer-events:none;
}

.terminal{
    position:relative;
    z-index:5;
    width:min(90%,820px);
    min-height:650px;
    padding:40px;
    border:1px solid rgba(0,255,157,.38);

    background:linear-gradient(
        135deg,
        rgba(0,18,13,.72),
        rgba(0,3,2,.82)
    );

    backdrop-filter:blur(4px);

    box-shadow:
        0 0 20px rgba(0,255,157,.20),
        0 0 70px rgba(0,255,157,.10),
        inset 0 0 50px rgba(0,255,157,.04);
}

.terminal::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:2px;

    background:linear-gradient(
        90deg,
        transparent,
        #00ff9d,
        #baffdf,
        #00ff9d,
        transparent
    );

    box-shadow:
        0 0 10px #00ff9d,
        0 0 30px #00ff9d;

    animation:terminalScan 3s linear infinite;
}

@keyframes terminalScan{
    0%,100%{opacity:.3;}
    50%{opacity:1;}
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:25px;
    border-bottom:1px solid rgba(0,255,157,.20);
    font-family:'Share Tech Mono',monospace;
    font-size:14px;
    letter-spacing:2px;
    color:#66ffbb;
}

.status{
    width:13px;
    height:13px;
    background:#00ff9d;
    border-radius:50%;

    box-shadow:
        0 0 10px #00ff9d,
        0 0 25px #00ff9d;

    animation:statusPulse 1.2s infinite;
}

@keyframes statusPulse{
    0%,100%{
        opacity:1;
        transform:scale(1);
    }
    50%{
        opacity:.3;
        transform:scale(.65);
    }
}

.screen{
    display:none;
    min-height:520px;
}

.screen.active{
    display:flex;
    flex-direction:column;
    animation:screenEnter .6s ease;
}

@keyframes screenEnter{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.logo{
    text-align:center;
    margin-top:50px;
}

.whatsapp-icon{
    width:95px;
    height:95px;
    margin:auto;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    border:3px solid #00ff9d;
    font-size:45px;
    color:#00ff9d;

    box-shadow:
        0 0 15px #00ff9d,
        0 0 35px rgba(0,255,157,.5);

    animation:iconGlow 2s ease-in-out infinite;
}

@keyframes iconGlow{
    0%,100%{
        transform:scale(1);
        box-shadow:
            0 0 15px #00ff9d,
            0 0 35px rgba(0,255,157,.5);
    }
    50%{
        transform:scale(1.06);
        box-shadow:
            0 0 25px #00ff9d,
            0 0 60px rgba(0,255,157,.8);
    }
}

.title{
    margin-top:30px;
    text-align:center;
    font-size:clamp(30px,6vw,50px);
    letter-spacing:5px;
    line-height:1.25;
    color:#45ffb0;

    text-shadow:
        0 0 10px rgba(0,255,157,.9),
        0 0 35px rgba(0,255,157,.5);
}

.subtitle{
    text-align:center;
    margin-top:25px;
    color:#6dbb91;
    font-family:'Share Tech Mono',monospace;
    font-size:14px;
    line-height:1.8;
}

.input-area{
    margin-top:45px;
}

.input-label{
    display:block;
    margin-bottom:12px;
    color:#64d49d;
    font-family:'Share Tech Mono',monospace;
    letter-spacing:2px;
}

.number-input{
    width:100%;
    padding:22px;
    background:rgba(0,5,4,.9);
    border:1px solid rgba(0,255,157,.4);
    outline:none;
    color:#00ff9d;
    font-size:20px;
    font-family:'Share Tech Mono',monospace;
}

.number-input::placeholder{
    color:rgba(0,255,157,.35);
}

.number-input:focus{
    border-color:#00ff9d;

    box-shadow:
        0 0 15px rgba(0,255,157,.4),
        inset 0 0 20px rgba(0,255,157,.07);
}


/* BUTTON */

.action-btn{
    position:relative;
    overflow:hidden;
    margin-top:25px;
    width:100%;
    min-height:68px;
    padding:20px;
    cursor:pointer;

    border:1px solid #00b870;

    background:linear-gradient(
        135deg,
        #010806,
        #062218,
        #010806
    );

    color:#00ff9d;
    font-family:'Orbitron',sans-serif;
    font-size:17px;
    font-weight:700;
    letter-spacing:3px;

    text-shadow:0 0 10px #00ff9d;

    animation:buttonGlow 2s ease-in-out infinite;
}

.action-btn::before{
    content:"";
    position:absolute;
    top:-50%;
    left:-40%;
    width:30%;
    height:200%;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(0,255,157,.6),
        rgba(180,255,220,.8),
        rgba(0,255,157,.6),
        transparent
    );

    transform:rotate(25deg);

    animation:buttonScan 2.2s linear infinite;
}

.action-btn::after{
    content:"";
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:2px;
    background:#00ff9d;

    box-shadow:
        0 0 10px #00ff9d,
        0 0 25px #00ff9d;
}

@keyframes buttonGlow{
    0%,100%{
        box-shadow:
            0 0 8px rgba(0,255,157,.2);
    }
    50%{
        box-shadow:
            0 0 20px rgba(0,255,157,.6),
            0 0 45px rgba(0,255,157,.25);
    }
}

@keyframes buttonScan{
    0%{
        left:-50%;
        opacity:0;
    }
    15%{
        opacity:1;
    }
    100%{
        left:130%;
        opacity:0;
    }
}

.action-btn:hover{
    transform:translateY(-4px);
    border-color:#9dffd1;

    box-shadow:
        0 0 25px rgba(0,255,157,.8),
        0 0 60px rgba(0,255,157,.3);
}

.action-btn:active{
    transform:scale(.97);
}


/* PROCESSING */

.processing-title{
    margin-top:70px;
    text-align:center;
    font-size:clamp(28px,5vw,45px);
    letter-spacing:4px;
    color:#00ff9d;

    text-shadow:
        0 0 12px #00ff9d,
        0 0 35px rgba(0,255,157,.7);
}

.message-box{
    margin-top:45px;
    height:300px;
    padding:25px;

    border:1px solid rgba(0,255,157,.28);

    background:rgba(0,0,0,.55);

    overflow-y:auto;

    font-family:'Share Tech Mono',monospace;
    font-size:15px;
    line-height:1.8;
}

.message{
    opacity:0;
    transform:translateX(-30px);
    margin-bottom:14px;
    color:#6be5a8;

    transition:
        opacity .45s ease,
        transform .45s ease;
}

.message.show{
    opacity:1;
    transform:translateX(0);
}

.message::before{
    content:"> ";
    color:#00ff9d;
}

.progress-container{
    margin-top:35px;
    width:100%;
    height:7px;
    background:rgba(0,255,157,.12);
    overflow:hidden;
}

.progress{
    width:0;
    height:100%;

    background:linear-gradient(
        90deg,
        #007b48,
        #00ff9d,
        #baffdf
    );

    box-shadow:
        0 0 15px #00ff9d,
        0 0 30px #00ff9d;

    transition:width .55s ease;
}


/* RESULT */

.result-screen{
    text-align:center;
}

.result-label{
    margin-top:65px;
    color:#64b68b;
    font-family:'Share Tech Mono',monospace;
    letter-spacing:3px;
}

.banned-title{
    margin-top:40px;
    font-size:clamp(35px,7vw,62px);
    letter-spacing:4px;
    color:#00ff9d;

    text-shadow:
        0 0 12px #00ff9d,
        0 0 40px rgba(0,255,157,.8);
}

.number-result{
    margin-top:40px;
    padding:25px;
    border:1px solid rgba(0,255,157,.35);
    background:rgba(0,0,0,.45);
    font-family:'Share Tech Mono',monospace;
    font-size:clamp(20px,4vw,28px);
    letter-spacing:3px;
    color:#5cffbb;
}

.result-text{
    margin-top:35px;
    color:#64a985;
    font-family:'Share Tech Mono',monospace;
    line-height:1.8;
    font-size:14px;
}

.return-btn{
    margin-top:50px;
}


/* FOOTER */

.footer{
    position:absolute;
    bottom:20px;
    left:0;
    width:100%;
    text-align:center;
    font-family:'Share Tech Mono',monospace;
    font-size:11px;
    letter-spacing:3px;
    color:#4b9470;
}


/* HIDDEN MUSIC VIDEO PLAYER */

#protocolMusic{
    position:fixed;
    width:1px;
    height:1px;
    opacity:0;
    pointer-events:none;
}


/* MOBILE */

@media(max-width:600px){

    body{
        padding:12px;
    }

    .terminal{
        width:100%;
        min-height:650px;
        padding:25px 20px;
    }

    .topbar{
        font-size:9px;
    }

    .whatsapp-icon{
        width:75px;
        height:75px;
        font-size:35px;
    }

    .title{
        letter-spacing:3px;
    }

    .number-input{
        padding:18px;
        font-size:16px;
    }

    .action-btn{
        min-height:60px;
        padding:17px;
        font-size:13px;
    }

    .message-box{
        height:280px;
        padding:18px;
        font-size:12px;
    }
}

</style>
</head>

<body>

<canvas id="matrixCanvas"></canvas>

<div class="background-overlay"></div>
<div class="background-glow"></div>


<!-- MUSIC PLAYER FIX -->

<video
    id="protocolMusic"
    playsinline
    preload="auto"
    loop
>
    <source
        src="https://files.catbox.moe/soh0hq.mp4"
        type="video/mp4"
    >
</video>


<div class="terminal">

    <div class="topbar">
        <span>ACCOUNT_CONTROL_TERMINAL</span>
        <div class="status"></div>
    </div>


    <!-- HOME -->

    <div class="screen active" id="homeScreen">

        <div class="logo">

            <div class="whatsapp-icon">☏</div>

            <h1 class="title">
                ACCOUNT CONTROL
                <br>
                SYSTEM
            </h1>

        </div>

        <p class="subtitle">
            ENTER A NUMBER TO START THE
            <br>
            TERMINAL DEMONSTRATION
        </p>

        <div class="input-area">

            <label class="input-label">
                TARGET NUMBER
            </label>

            <input
                type="tel"
                id="phoneNumber"
                class="number-input"
                placeholder="+94 XX XXX XXXX"
            >

            <button
                class="action-btn"
                id="startButton"
                onclick="startProcess()"
            >
                START PROTOCOL
            </button>

        </div>

    </div>


    <!-- PROCESSING -->

    <div class="screen" id="processingScreen">

        <h1 class="processing-title">
            ACCOUNT PROTOCOL
        </h1>

        <div
            class="message-box"
            id="messageBox"
        ></div>

        <div class="progress-container">
            <div
                class="progress"
                id="progress"
            ></div>
        </div>

        <p class="subtitle">
            SYSTEM PROCESSING...
        </p>

    </div>


    <!-- RESULT -->

    <div class="screen result-screen" id="resultScreen">

        <div class="result-label">
            SYSTEM_STATUS_COMPLETE
        </div>

        <h1 class="banned-title">
            ACCOUNT BANNED
        </h1>

        <div
            class="number-result"
            id="resultNumber"
        >
            +94XXXXXXXXX
        </div>

        <p class="result-text">
            THE SELECTED ACCOUNT HAS BEEN
            <br>
            PROCESSED IN THIS DEMONSTRATION
        </p>

        <button
            class="action-btn return-btn"
            onclick="returnHome()"
        >
            RETURN TO TERMINAL
        </button>

    </div>


    <div class="footer">
        DESIGNED BY VENOMX SYSTEM
    </div>

</div>


<script>

/* =====================================
   MATRIX BACKGROUND
===================================== */

const canvas =
document.getElementById("matrixCanvas");

const ctx =
canvas.getContext("2d");

const fontSize = 18;

const characters =
"0101010101ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz#$%&@{}[]<>/\\|+-=!?";

let columns;
let drops;
let speeds;


function resizeMatrix(){

    canvas.width =
    window.innerWidth;

    canvas.height =
    window.innerHeight;

    columns =
    Math.floor(
        canvas.width / fontSize
    );

    drops =
    Array.from(
        {length:columns},
        () =>
        Math.random() *
        -canvas.height / fontSize
    );

    speeds =
    Array.from(
        {length:columns},
        () =>
        0.5 + Math.random() * 1.5
    );
}


resizeMatrix();

window.addEventListener(
    "resize",
    resizeMatrix
);


function drawMatrix(){

    ctx.fillStyle =
    "rgba(0,3,2,0.09)";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.font =
    "bold " +
    fontSize +
    "px monospace";


    for(
        let i = 0;
        i < drops.length;
        i++
    ){

        const text =
        characters[
            Math.floor(
                Math.random() *
                characters.length
            )
        ];

        const brightness =
        Math.floor(
            150 +
            Math.random() * 105
        );

        ctx.fillStyle =
        `rgb(0,${brightness},${Math.floor(brightness * 0.62)})`;

        ctx.shadowColor =
        "#00ff9d";

        ctx.shadowBlur =
        Math.random() * 10;

        ctx.fillText(
            text,
            i * fontSize,
            drops[i] * fontSize
        );

        ctx.shadowBlur = 0;

        drops[i] += speeds[i];

        if(
            drops[i] * fontSize >
            canvas.height + 30
            &&
            Math.random() > 0.97
        ){

            drops[i] =
            Math.random() * -50;

        }

    }

    requestAnimationFrame(drawMatrix);
}


drawMatrix();



/* =====================================
   MUSIC FIX
===================================== */

const music =
document.getElementById("protocolMusic");

music.loop = true;
music.volume = 0.8;


/* Show errors in console for debugging */

music.addEventListener(
    "error",
    () => {

        console.log(
            "Music loading error:",
            music.error
        );

    }
);


function playMusic(){

    /* Make sure it is not muted */

    music.muted = false;

    music.volume = 0.8;


    const playPromise =
    music.play();


    if(playPromise !== undefined){

        playPromise
        .then(() => {

            console.log(
                "Music started successfully"
            );

        })
        .catch(error => {

            console.log(
                "Music playback error:",
                error
            );

        });

    }

}



/* =====================================
   TERMINAL MESSAGES
===================================== */

const messages = [

    "[SYS] Connecting to account terminal...",

    "[OK] Target account located...",

    "[SYS] Retrieving account information...",

    "[SYS] Loading verification protocol...",

    "[SCAN] Checking account status...",

    "[SYS] Initializing account action...",

    "[SYS] Processing terminal protocol...",

    "[OK] System process completed..."

];


/* =====================================
   START PROCESS
===================================== */

function startProcess(){

    const number =
    document
    .getElementById("phoneNumber")
    .value
    .trim();


    if(number === ""){

        alert(
            "Please enter a number!"
        );

        return;

    }


    /*
       START MUSIC DIRECTLY
       FROM USER BUTTON CLICK
    */

    playMusic();


    document
    .getElementById("homeScreen")
    .classList
    .remove("active");


    document
    .getElementById("processingScreen")
    .classList
    .add("active");


    const messageBox =
    document.getElementById("messageBox");


    const progress =
    document.getElementById("progress");


    messageBox.innerHTML = "";

    progress.style.width = "0%";


    let index = 0;


    const interval =
    setInterval(() => {

        if(index < messages.length){

            const message =
            document.createElement("div");

            message.className =
            "message";

            message.innerText =
            messages[index];

            messageBox.appendChild(message);


            setTimeout(() => {

                message.classList.add("show");

            },100);


            messageBox.scrollTop =
            messageBox.scrollHeight;


            progress.style.width =
            (
                ((index + 1) /
                messages.length) * 100
            ) + "%";


            index++;

        }

        else{

            clearInterval(interval);

            setTimeout(() => {

                showResult(number);

            },1500);

        }

    },900);

}


/* =====================================
   RESULT
===================================== */

function showResult(number){

    document
    .getElementById("processingScreen")
    .classList
    .remove("active");


    document
    .getElementById("resultScreen")
    .classList
    .add("active");


    document
    .getElementById("resultNumber")
    .innerText =
    number;

}


/* =====================================
   RETURN HOME
===================================== */

function returnHome(){

    document
    .getElementById("resultScreen")
    .classList
    .remove("active");


    document
    .getElementById("homeScreen")
    .classList
    .add("active");


    document
    .getElementById("phoneNumber")
    .value = "";


    /* Music continues */

}

</script>

</body>
</html>
